<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBTC MINING</title>
    <!-- Ikona aplikacji (Logo PNG) -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/39Gy33y3/logo.png">
    <!-- Biblioteka Ethers.js do obsługi sieci Polygon -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            /* Poprawione tło dla telefonów (usunięto 'fixed', dodano bezpieczne właściwości) */
            background-color: #000000;
            background-image: url('https://i.ibb.co/LXNjxc4q/background.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .container {
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 {
            margin-top: 0;
            color: #f7931a;
            letter-spacing: 1px;
        }

        .counter-box {
            background: #111;
            border: 2px solid #f7931a;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .counter {
            font-size: 28px;
            font-weight: bold;
            color: #f7931a;
            font-family: monospace;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }

        button {
            width: 98%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #8247e5; /* Kolor sieci Polygon */
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #6f33d0;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>WBTC MINING</h2>
    
    <div class="counter-box">
        <div>WYKOPANO WBTC:</div>
        <div class="counter" id="btcCounter">0.00000000</div>
    </div>

    <input type="text" id="walletAddress" placeholder="Wklej adres EVM (Polygon)">
    <button onclick="requestPayout()">WYPŁAĆ 1 WBTC</button>

    <div class="status" id="statusMessage"></div>
</div>

<script>
    // Logika licznika 0.00000000 do 1.00000000 w 24 godziny
    const TOTAL_TIME = 24 * 60 * 60; // 86400 sekund
    let startTime = localStorage.getItem('miningStartTimeWBTC');

    if (!startTime) {
        startTime = Date.now();
        localStorage.setItem('miningStartTimeWBTC', startTime);
    }

    function updateCounter() {
        const now = Date.now();
        const elapsedSeconds = (now - startTime) / 1000;
        let progress = elapsedSeconds / TOTAL_TIME;

        if (progress > 1) progress = 1;

        const btcAmount = (progress * 1.00000000).toFixed(8);
        document.getElementById('btcCounter').innerText = btcAmount;
    }

    setInterval(updateCounter, 1000);
    updateCounter();

    // Obsługa kliknięcia wypłaty
    async function requestPayout() {
        const address = document.getElementById('walletAddress').value.trim();
        const status = document.getElementById('statusMessage');

        if (!ethers.utils.isAddress(address)) {
            status.style.color = "red";
            status.innerText = "Niepoprawny adres EVM!";
            return;
        }

        status.style.color = "yellow";
        status.innerText = "Przetwarzanie transakcji w sieci Polygon...";

        try {
            const response = await fetch('/api/payout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recipient: address })
            });

            const data = await response.json();

            if (data.success) {
                status.style.color = "green";
                status.innerText = `Wypłacono pomyślnie! TxHash: ${data.txHash}`;
            } else {
                status.style.color = "red";
                status.innerText = `Błąd: ${data.message}`;
            }
        } catch (err) {
            status.style.color = "red";
            status.innerText = "Błąd połączenia z serwerem wypłat.";
        }
    }
</script>

</body>
</html>
