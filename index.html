<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WBTC MINING</title>
<!-- Ikona aplikacji (Logo PNG) -->
<link rel="icon" type="image/png" href="https://i.ibb.co/39Gy33y3/logo.png">
<!-- Biblioteka Ethers.js do obsługi sieci Polygon -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
position: relative;
}

body {
font-family: Arial, sans-serif;
background-color: #000000;
color: #ffffff;
display: flex;
justify-content: center;
align-items: center;
}

/* Dedykowana warstwa tła – wymusza idealne dopasowanie grafiki bez kafelkowania i powielania */
.bg-layer {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background-image: url('https://i.ibb.co/LXNjxc4q/background.jpg');
background-position: center center;
background-repeat: no-repeat;
background-size: cover;
z-index: -1;
}

.container {
background: rgba(0, 0, 0, 0.85);
padding: 25px;
border-radius: 16px;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
backdrop-filter: blur(8px);
text-align: center;
max-width: 400px;
width: 90%;
z-index: 10;
}

h2 {
margin-top: 0;
color: #f7931a;
letter-spacing: 1px;
}

.counter-box {
background: #111;
border: 2px solid #f7931a;
padding: 15px;
border-radius: 10px;
margin: 20px 0;
}

.counter {
font-size: 28px;
font-weight: bold;
color: #f7931a;
font-family: monospace;
}

input {
width: 90%;
padding: 12px;
margin-bottom: 15px;
border-radius: 6px;
border: 1px solid #444;
background: #222;
color: #fff;
text-align: center;
font-size: 14px;
}

button {
width: 98%;
padding: 14px;
border: none;
border-radius: 6px;
background: #8247e5; /* Kolor sieci Polygon */
color: white;
font-size: 16px;
font-weight: bold;
cursor: pointer;
transition: 0.3s;
}

button:hover {
background: #6f33d0;
}

.status {
margin-top: 15px;
font-size: 14px;
word-break: break-all;
}
</style>
</head>
<body>

<!-- Stała warstwa tła niezależna od przewijania i paska przeglądarki -->
<div class="bg-layer"></div>

<div class="container">
<h2>WBTC MINING</h2>

<div class="counter-box">
<div>WYKOPANO WBTC:</div>
<div class="counter" id="btcCounter">0.00000000</div>
</div>

<input type="text" id="walletAddress" placeholder="Wklej adres EVM (Polygon)">
<button onclick="requestPayout()">WYPŁAĆ 1 WBTC</button>

<div class="status" id="statusMessage"></div>
</div>

<script>
// Czas trwania: 7 minut (420 sekund)
const TOTAL_TIME = 7 * 60; 
const STORAGE_KEY = 'miningStartTimeWBTC_fixed_v2';

let startTime = localStorage.getItem(STORAGE_KEY);

if (!startTime || isNaN(startTime)) {
startTime = Date.now();
localStorage.setItem(STORAGE_KEY, startTime);
} else {
startTime = Number(startTime);
}

function updateCounter() {
const now = Date.now();
const elapsedSeconds = (now - startTime) / 1000;
let progress = elapsedSeconds / TOTAL_TIME;

if (progress > 1) {
progress = 1;
}

const btcAmount = (progress * 1.00000000).toFixed(8);
document.getElementById('btcCounter').innerText = btcAmount;
}

setInterval(updateCounter, 1000);
updateCounter();

// Obsługa kliknięcia wypłaty
async function requestPayout() {
const address = document.getElementById('walletAddress').value.trim();
const status = document.getElementById('statusMessage');

if (!ethers.utils.isAddress(address)) {
status.style.color = "red";
status.innerText = "Niepoprawny adres EVM!";
return;
}

status.style.color = "yellow";
status.innerText = "Przetwarzanie transakcji w sieci Polygon...";

try {
const response = await fetch('/api/payout', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ recipient: address })
});

const data = await response.json();

if (data.success) {
status.style.color = "green";
status.innerText = `Wypłacono pomyślnie! TxHash: ${data.txHash}`;

// ===== KLUCZOWA ZMIANA: RESETUJEMY CZAS STARTU PO WYPŁACIE =====
startTime = Date.now();
localStorage.setItem(STORAGE_KEY, startTime);
updateCounter(); // Natychmiast odświeżamy widok licznika na 0.00000000
} else {
status.style.color = "red";
status.innerText = `Błąd: ${data.message}`;
}
} catch (err) {
status.style.color = "red";
status.innerText = "Błąd połączenia z serwerem wypłat.";
}
}
</script>

</body>
</html>
